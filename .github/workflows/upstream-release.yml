
name: Build 32-bit ARMv7 APK

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE=$(gh api repos/deveshrai/Solidcraft-Android-Port/releases/latest)
          TAG=$(jq -r '.tag_name' <<< "$RELEASE")
          NAME=$(jq -r '.name // .tag_name' <<< "$RELEASE")

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: deveshrai/Solidcraft-Android-Port
          ref: ${{ steps.upstream.outputs.tag }}
          path: source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build 32-bit APK
        working-directory: source/apps/solidcraft-android/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -Psolidcraft.abis=armeabi-v7a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-armv7-${{ steps.upstream.outputs.tag }}
          path: source/apps/solidcraft-android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
